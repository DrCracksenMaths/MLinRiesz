name: rt-adapter-identity-test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/rt_adapter_identity_test.py"
      - ".github/workflows/rt_adapter_identity_test.yml"
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pandas torch torchvision
      - run: python experiments/rt_adapter_identity_test.py
