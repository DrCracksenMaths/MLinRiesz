name: cifar10-exact-rt-ablation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/cifar10_exact_rt_ablation.py"
      - ".github/workflows/cifar10_exact_rt_ablation.yml"
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        seed: [0,1,2,3,4]
        model: [cnn,rt_film,alg_film,rt_adapter,alg_adapter]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pandas scipy torch torchvision
      - run: python experiments/cifar10_exact_rt_ablation.py --seed ${{ matrix.seed }} --model ${{ matrix.model }} --out results
      - uses: actions/upload-artifact@v4
        with:
          name: exact-${{ matrix.model }}-${{ matrix.seed }}
          path: results/*
          retention-days: 30
  aggregate:
    needs: experiment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: "exact-*", path: all, merge-multiple: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas scipy
      - run: |
          python - <<'PY'
          import glob,pandas as pd
          from scipy import stats
          fs=[f for f in glob.glob("all/*.csv") if "bycorr_" not in f]
          d=pd.concat([pd.read_csv(f) for f in fs],ignore_index=True)
          d.to_csv("all/all.csv",index=False)
          s=d.groupby(["model","split"]).agg(acc=("accuracy","mean"),sd=("accuracy","std"),nll=("nll","mean"),params=("params","first"),width=("width","first")).reset_index()
          s.to_csv("all/summary.csv",index=False)
          q=d[d.split=="unseen_severity"].pivot(index="seed",columns="model",values="accuracy")
          pairs=[("rt_film","alg_film"),("rt_adapter","alg_adapter"),("rt_adapter","cnn"),("alg_adapter","cnn")]
          rows=[]
          for a,b in pairs:
              z=q[a]-q[b]; t,p=stats.ttest_rel(q[a],q[b])
              rows.append([a,b,z.mean(),int((z>0).sum()),int((z<0).sum()),t,p])
          pd.DataFrame(rows,columns=["a","b","diff","wins","losses","t","p"]).to_csv("all/pairs.csv",index=False)
          bc=pd.concat([pd.read_csv(f) for f in glob.glob("all/bycorr_*.csv")],ignore_index=True)
          bc.groupby(["model","split","corruption"]).accuracy.agg(["mean","std"]).reset_index().to_csv("all/bycorr.csv",index=False)
          print(s.to_string(index=False)); print(pd.DataFrame(rows).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-rt-ablation-summary
          path: |
            all/all.csv
            all/summary.csv
            all/pairs.csv
            all/bycorr.csv
